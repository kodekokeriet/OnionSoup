name: Check build
on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**/README.md'
      - 'website/**'

jobs:
  build:
    name: Check build
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain:latest
      options: --user root
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Build release zip
      shell: bash
      run: |
        source /root/.bashrc
        make release
    - name: Upload installable zip
      uses: actions/upload-artifact@v4
      with:
        name: OnionSoup-build-${{ github.sha }}
        path: release/*.zip
        if-no-files-found: error
